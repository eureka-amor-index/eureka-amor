  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap');

    :root {
      --bg: #0a0a0a;
      --accent: #ff3366;
      --accent-soft: #ff99bb;
      --text: #eeeeee;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      line-height: 1.6;
    }

    header {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 2rem;
      overflow: hidden;
    }

    .hero {
      position: relative;
      z-index: 2;
      max-width: 760px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(4rem, 14vw, 5.5rem);
      margin-bottom: 1rem;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: clamp(1.05rem, 4vw, 1.4rem);
      opacity: 0.9;
      margin-bottom: 3rem;
    }

    .btn {
      display: inline-block;
      padding: 14px 42px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(255, 51, 102, 0.4);
      outline: none;
    }

    .particles {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 51, 102, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: fixed;
      width: 4px;
      height: 4px;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    main {
      min-height: 40vh;
      padding: 5rem 2rem;
      text-align: center;
    }

    #explore {
      max-width: 720px;
      margin: 0 auto;
      opacity: 0.86;
    }
  </style>
</head>

<body>
  <header>
    <div class="particles" aria-hidden="true"></div>

    <div class="hero">
      <h1>ARA</h1>
      <p class="subtitle">Tu espacio. Tu energía. Tu mundo.</p>
      <a href="#explore" class="btn">Entrar</a>
    </div>
  </header>

  <main id="explore">
    <p>ARA está despierta. Una señal suave en la oscuridad.</p>
  </main>

  <script>
    // =========================================================
    // ARA PARTICLE FIELD
    // Soft little lights. Girlypop cosmic dust.
    // =========================================================

    function createParticle() {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.opacity = Math.random() * 0.6 + 0.2;
      particle.style.left = Math.random() * 100 + 'vw';
      particle.style.top = '-10px';

      document.body.appendChild(particle);

      const duration = Math.random() * 8000 + 6000;

      particle.animate(
        [
          { transform: 'translateY(0)', opacity: 0.6 },
          { transform: `translateY(${window.innerHeight + 50}px)`, opacity: 0 }
        ],
        {
          duration,
          easing: 'linear'
        }
      );

      setTimeout(() => particle.remove(), duration);
    }

    setInterval(createParticle, 120);

    document.addEventListener('click', () => {
      for (let i = 0; i < 8; i++) {
        setTimeout(createParticle, i * 30);
      }
    });
  </script>
</body>
</html>
