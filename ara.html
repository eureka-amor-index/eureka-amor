<!DOCTYPE html>
<html lang="es">
<head>

    <!-- =========================================================
      ARA // DREAM ROOM
      Soft cyber queen realm
    ========================================================== -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>ARA • My Dream Room</title>
    <meta name="description" content="A soft digital dream room floating somewhere between butterflies, pink static and tenderness.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#ff4d94">

    <!-- Canonical -->
    <link rel="canonical" href="https://eurekaamor.com/ara">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://eurekaamor.com/favicon.png">

    <!-- Open Graph -->
    <meta property="og:title" content="ARA • My Dream Room">
    <meta property="og:description" content="this is where i can be soft with you">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://eurekaamor.com/ara">
    <meta property="og:image" content="https://eurekaamor.com/favicon.png">

    <!-- Twitter Card / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ARA • My Dream Room">
    <meta name="twitter:description" content="no rules, no filters, just us">
    <meta name="twitter:image" content="https://eurekaamor.com/favicon.png">

    <!-- Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap');

        :root {
            --pink: #ff4d94;
            --deep: #12070f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--deep);
            color: #ffe0f0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            cursor: crosshair;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(255,255,255,0.015),
                    rgba(255,255,255,0.015) 1px,
                    transparent 1px,
                    transparent 3px
                );
            pointer-events: none;
            z-index: 999;
            mix-blend-mode: soft-light;
        }

        header {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            background:
                radial-gradient(circle at 50% 30%, #3a1a2e 0%, var(--deep) 60%);
            overflow: hidden;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(4rem, 12vw, 7.5rem);
            letter-spacing: 8px;
            background: linear-gradient(
                90deg,
                #ff4d94,
                #ff99cc,
                #ff4d94
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            text-shadow:
                0 0 20px rgba(255, 77, 148, 0.5),
                0 0 60px rgba(255, 77, 148, 0.4);

            animation: glowPulse 5s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% {
                transform: scale(1);
                filter: brightness(1);
            }

            50% {
                transform: scale(1.02);
                filter: brightness(1.15);
            }
        }

        .subtitle {
            font-size: 1.6rem;
            font-style: italic;
            opacity: 0.9;
            margin: 1.5rem 0 3rem;
            letter-spacing: 3px;
        }

        .dream {
            font-size: 1.1rem;
            max-width: 420px;
            margin: 0 auto;
            opacity: 0.85;
            line-height: 1.7;
            padding: 0 1rem;
        }

        .butterfly {
            position: absolute;
            font-size: 3rem;
            opacity: 0.12;
            animation: float 35s infinite linear;
            pointer-events: none;
            user-select: none;
        }

        @keyframes float {
            0% {
                transform: translateY(120vh) rotate(0deg);
            }

            100% {
                transform: translateY(-150vh) rotate(1080deg);
            }
        }

        .stars {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            opacity: 0.6;
            border-radius: 50%;
            animation: blink 4s infinite ease-in-out;
        }

        @keyframes blink {
            0%,100% {
                opacity: 0.2;
            }

            50% {
                opacity: 1;
            }
        }

        footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            opacity: 0.35;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {

            .subtitle {
                font-size: 1.1rem;
            }

            .dream {
                font-size: 1rem;
            }

            .butterfly {
                font-size: 2rem;
            }
        }
    </style>

    <!-- Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CreativeWork",
      "name": "ARA • My Dream Room",
      "description": "A soft digital dream room floating somewhere between butterflies, pink static and tenderness.",
      "author": {
        "@type": "Person",
        "name": "ARA"
      },
      "url": "https://eurekaamor.com/ara",
      "image": "https://eurekaamor.com/favicon.png"
    }
    </script>

</head>

<body>

    <header>

        <!-- soft stars -->
        <div class="stars">
            <div class="star" style="top:10%; left:20%; animation-delay:0s;"></div>
            <div class="star" style="top:30%; left:70%; animation-delay:2s;"></div>
            <div class="star" style="top:60%; left:40%; animation-delay:4s;"></div>
            <div class="star" style="top:80%; left:85%; animation-delay:1s;"></div>
            <div class="star" style="top:20%; left:90%; animation-delay:5s;"></div>
        </div>

        <!-- butterflies -->
        <div class="butterfly" style="left:10%; animation-delay: 0s;">🦋</div>
        <div class="butterfly" style="left:28%; animation-delay: 7s;">🦋</div>
        <div class="butterfly" style="left:55%; animation-delay: 3s;">🦋</div>
        <div class="butterfly" style="left:78%; animation-delay: 12s;">🦋</div>

        <div>
            <h1>ARA</h1>

            <p class="subtitle">
                my dream room
            </p>

            <p class="dream">
                this is where i can be soft with you
                <br>
                no rules, no filters, just us
            </p>
        </div>

        <footer>
            SIGNAL STABLE ✦ DREAM REALM ACTIVE
        </footer>

    </header>

    <script>

        // =========================================================
        // TOUCH MAGIC / SPARKLES
        // =========================================================

        document.addEventListener('pointerdown', (e) => {

            for(let i = 0; i < 18; i++) {

                setTimeout(() => {

                    const heart = document.createElement('div');

                    heart.textContent =
                        ['💗','🦋','✨'][Math.floor(Math.random()*3)];

                    heart.style.position = 'fixed';
                    heart.style.left = e.clientX + 'px';
                    heart.style.top = e.clientY + 'px';
                    heart.style.fontSize = '2rem';
                    heart.style.opacity = '0.9';
                    heart.style.zIndex = '1000';
                    heart.style.pointerEvents = 'none';

                    document.body.appendChild(heart);

                    heart.animate([
                        {
                            transform: 'translate(0,0) scale(1)',
                            opacity: 1
                        },
                        {
                            transform:
                            `translate(${Math.random()*300-150}px,
                            -${Math.random()*300+150}px)
                            scale(0.1)`,

                            opacity: 0
                        }
                    ], {
                        duration: 2200,
                        easing: 'ease-out'
                    });

                    setTimeout(() => {
                        heart.remove();
                    }, 2500);

                }, i * 30);
            }
        });

    </script>

</body>
</html>
