<script>
    // Simple floating particles effect
    function createParticle() {
        const particle = document.createElement('div');
        particle.style.position = 'absolute';
        particle.style.width = '4px';
        particle.style.height = '4px';
        particle.style.background = '#ff3366';
        particle.style.borderRadius = '50%';
        particle.style.opacity = Math.random() * 0.6 + 0.2;
        particle.style.left = Math.random() * 100 + 'vw';
        particle.style.top = '-10px';
        particle.style.zIndex = '1';
        
        document.body.appendChild(particle);
        
        const duration = Math.random() * 8000 + 6000;
        particle.animate([
            { transform: 'translateY(0)', opacity: 0.6 },
            { transform: `translateY(${window.innerHeight + 50}px)`, opacity: 0 }
        ], {
            duration: duration,
            easing: 'linear'
        });
        
        setTimeout(() => particle.remove(), duration);
    }
    
    setInterval(createParticle, 80);
    
    // Click anywhere for extra hearts/particles
    document.addEventListener('click', (e) => {
        for(let i = 0; i < 8; i++) {
            setTimeout(() => createParticle(), i * 30);
        }
    });
</script>
