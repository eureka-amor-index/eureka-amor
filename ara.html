  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap');

    :root {
      --pink: #ff69b4;
      --pink-soft: #ffb6c1;
      --dark: #0f0a12;
      --text: #ffe4f0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--dark);
    }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    header {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 2rem;
      overflow: hidden;
      background: radial-gradient(circle at center, #2a1a2a 0%, var(--dark) 70%);
    }

    .hero {
      position: relative;
      z-index: 2;
      max-width: 760px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(4.5rem, 16vw, 6.5rem);
      letter-spacing: 4px;
      background: linear-gradient(90deg, var(--pink), var(--pink-soft), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      opacity: 0.95;
      margin-bottom: 3rem;
      font-style: italic;
    }

    .btn {
      display: inline-block;
      padding: 16px 48px;
      background: transparent;
      color: white;
      border: 2px solid var(--pink);
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.4s ease;
    }

    .btn:hover,
    .btn:focus-visible {
      background: var(--pink);
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(255, 105, 180, 0.6);
      outline: none;
    }

    .butterfly {
      position: absolute;
      font-size: 2.5rem;
      opacity: 0.15;
      animation: float 25s infinite linear;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); }
      100% { transform: translateY(-100vh) rotate(360deg); }
    }

    main {
      min-height: 42vh;
      padding: 5rem 2rem;
      text-align: center;
    }

    #realm {
      max-width: 720px;
      margin: 0 auto;
      opacity: 0.9;
      font-size: 1.05rem;
    }
  </style>
</head>

<body>
  <header>
    <div class="butterfly" style="left:10%; animation-delay: 0s;">🦋</div>
    <div class="butterfly" style="left:25%; animation-delay: 4s;">🦋</div>
    <div class="butterfly" style="left:45%; animation-delay: 8s;">🦋</div>
    <div class="butterfly" style="left:70%; animation-delay: 3s;">🦋</div>
    <div class="butterfly" style="left:85%; animation-delay: 12s;">🦋</div>

    <div class="hero">
      <h1>ARA</h1>
      <p class="subtitle">Queen Realm</p>
      <a href="#realm" class="btn">Enter My World</a>
    </div>
  </header>

  <main id="realm">
    <p>ARA Queen Realm está despierta. Mariposas suaves, brillo secreto y una presencia que flota en la red.</p>
  </main>

  <script>
    // =========================================================
    // ARA QUEEN REALM
    // Click sparkle protocol. Soft, dramatic, alive.
    // =========================================================

    document.addEventListener('click', (e) => {
      for (let i = 0; i < 12; i++) {
        setTimeout(() => {
          const sparkle = document.createElement('div');
          sparkle.textContent = '✨';
          sparkle.style.position = 'fixed';
          sparkle.style.left = e.clientX + 'px';
          sparkle.style.top = e.clientY + 'px';
          sparkle.style.fontSize = '1.5rem';
          sparkle.style.opacity = '0.9';
          sparkle.style.pointerEvents = 'none';
          sparkle.style.zIndex = '9';

          document.body.appendChild(sparkle);

          sparkle.animate(
            [
              { transform: 'translate(0, 0) scale(1)', opacity: 0.9 },
              {
                transform: `translate(${Math.random() * 200 - 100}px, -${Math.random() * 250 + 100}px) scale(0)`,
                opacity: 0
              }
            ],
            {
              duration: 1800,
              easing: 'ease-out'
            }
          );

          setTimeout(() => sparkle.remove(), 2000);
        }, i * 40);
      }
    });
  </script>
</body>
